name: CPU checks
on: [push, pull_request]
jobs:
  tutorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-cpu.txt -e .
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==4.53.3 peft==0.16.0 accelerate==1.9.0 huggingface-hub==0.33.4 safetensors==0.5.3
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q finance_qlora
      - run: python scripts/validate_notebooks.py
